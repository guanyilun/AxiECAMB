# Example cobaya input for the AxiECAMB theory wrapper.
# Replace the placeholder likelihood with one that requests Cl.
# See README.md for the available wrapper options and parameter names.

theory:
  axiecamb.AxiECAMB:
    python_path: /Users/yilun/Workspace/uoft/axion/AxiECAMB/python
    use_axfrac: true
    accurate_bb: false
    num_threads: 0
    extra_args: {}

likelihood:
  one: null

params:
  ombh2:
    prior: {min: 0.017, max: 0.027}
    ref: {dist: norm, loc: 0.0224, scale: 0.0002}
    proposal: 0.0001
    latex: \Omega_\mathrm{b} h^2
  omdah2:
    prior: {min: 0.09, max: 0.15}
    ref: {dist: norm, loc: 0.12, scale: 0.002}
    proposal: 0.001
    latex: \Omega_\mathrm{da} h^2
  axfrac:
    prior: {min: 0.0, max: 1.0}
    ref: 0.1
    proposal: 0.05
    latex: f_\mathrm{ax}
  log10_m_ax:
    prior: {min: -33.0, max: -24.0}
    ref: -27.0
    proposal: 0.5
    latex: \log_{10}(m_\mathrm{ax}/\mathrm{eV})
  g_axion:
    prior: {min: 0.0, max: 1.0}
    ref: 0.05
    proposal: 0.02
    latex: g_{a\gamma} M_\mathrm{pl}
  H0:
    prior: {min: 55, max: 80}
    ref: {dist: norm, loc: 67.4, scale: 0.5}
    proposal: 0.3
    latex: H_0
  logA:
    prior: {min: 2.6, max: 3.5}
    ref: {dist: norm, loc: 3.05, scale: 0.01}
    proposal: 0.01
    drop: true
    latex: \log(10^{10} A_\mathrm{s})
  As:
    value: 'lambda logA: 1e-10*np.exp(logA)'
    latex: A_\mathrm{s}
  ns:
    prior: {min: 0.9, max: 1.05}
    ref: {dist: norm, loc: 0.965, scale: 0.004}
    proposal: 0.002
    latex: n_\mathrm{s}
  tau:
    prior: {min: 0.01, max: 0.2}
    ref: {dist: norm, loc: 0.055, scale: 0.006}
    proposal: 0.003
    latex: \tau_\mathrm{reio}
  omnuh2: 0.6451439e-3
  omk: 0.0
  zstar: {derived: true, latex: z_*}
  rstar: {derived: true, latex: r_*}
  theta_MC_100: {derived: true, latex: 100\theta_\mathrm{MC}}
  age: {derived: true, latex: 'Age/\mathrm{Gyr}'}
  omegam: {derived: true, latex: \Omega_\mathrm{m}}

sampler:
  mcmc:
    drag: false
    oversample_power: 0.4
    proposal_scale: 1.9

output: chains/axiecamb_run
